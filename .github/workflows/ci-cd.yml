name: CI and Lightsail deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: submissions
          POSTGRES_USER: ragezine
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragezine -d submissions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DB_ENGINE: postgres
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "0"
      POSTGRES_DB: submissions
      POSTGRES_USER: ragezine
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      RAGEZINE_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python manage.py test submissions
        working-directory: backend

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/ragezine-portal/package-lock.json
      - run: npm ci
        working-directory: frontend/ragezine-portal
      - run: npm run lint
        working-directory: frontend/ragezine-portal
      - run: npm run build
        working-directory: frontend/ragezine-portal
      - run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet

  deploy:
    if: github.event_name == 'push'
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip commits superseded on main
        id: latest
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$GITHUB_SHA" == "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit is available; this deployment is skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check deployment secrets
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          for name in LIGHTSAIL_HOST LIGHTSAIL_USER LIGHTSAIL_SSH_KEY LIGHTSAIL_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Package application source
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/ragezine-release.tar.gz" \
            --exclude='backend/.env*' \
            --exclude='backend/media' \
            --exclude='backend/db.sqlite3' \
            --exclude='backend/rage-env' \
            --exclude='backend/staticfiles' \
            --exclude='backend/__pycache__' \
            --exclude='frontend/ragezine-portal/.env*' \
            --exclude='frontend/ragezine-portal/node_modules' \
            --exclude='frontend/ragezine-portal/dist' \
            docker-compose.yml backend frontend/ragezine-portal
      - name: Configure SSH
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload and deploy
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          target="$LIGHTSAIL_USER@$LIGHTSAIL_HOST"
          ssh -o StrictHostKeyChecking=yes "$target" 'mkdir -p "$HOME/ragezine-portal/incoming"'
          scp -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/ragezine-release.tar.gz" \
            "$target:ragezine-portal/incoming/$GITHUB_SHA.tar.gz"
          ssh -o StrictHostKeyChecking=yes "$target" \
            "bash -s -- '$GITHUB_SHA'" < ops/deploy-lightsail.sh
      - name: Verify public HTTPS
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        run: |
          target="$LIGHTSAIL_USER@$LIGHTSAIL_HOST"
          public_host="$(ssh -o StrictHostKeyChecking=yes "$target" \
            'sed -n "s/^RAGEZINE_PUBLIC_HOST=//p" "$HOME/ragezine-portal/shared/.env"')"
          if [[ ! "$public_host" =~ ^[a-z0-9.-]+$ ]]; then
            echo "::error::Invalid RAGEZINE_PUBLIC_HOST on the server"
            exit 1
          fi
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-all-errors --max-time 15 "https://$public_host/" > /dev/null
