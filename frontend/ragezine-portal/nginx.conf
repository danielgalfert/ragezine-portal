map $http_x_forwarded_proto $django_forwarded_proto {
    default $scheme;
    https https;
}

map $http_x_forwarded_for $django_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

map "$request_method:$uri" $login_rate_key {
    default "";
    "POST:/api/auth/login/" $django_forwarded_for;
    "POST:/admin/login/" $django_forwarded_for;
}

map "$request_method:$uri" $submission_rate_key {
    default "";
    "POST:/api/submissions/" $django_forwarded_for;
}

limit_req_zone $login_rate_key zone=login:10m rate=${RAGEZINE_NGINX_LOGIN_RATE};
limit_req_zone $submission_rate_key zone=submission:10m rate=${RAGEZINE_NGINX_SUBMISSION_RATE};

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size ${RAGEZINE_NGINX_MAX_BODY_SIZE};

    location = /media { return 404; }
    location ^~ /media/ { return 404; }

    location /static/ {
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=login burst=${RAGEZINE_NGINX_LOGIN_BURST} nodelay;
        limit_req zone=submission burst=${RAGEZINE_NGINX_SUBMISSION_BURST} nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        error_page 413 = @upload_too_large;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $django_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
        proxy_read_timeout ${RAGEZINE_NGINX_PROXY_READ_TIMEOUT};
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many requests. Please try again later."}';
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"detail":"Upload exceeds the server size limit."}';
    }

    location /admin/ {
        limit_req zone=login burst=${RAGEZINE_NGINX_LOGIN_BURST} nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $django_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
