map "$request_method:$uri" $login_rate_key {
    default "";
    "POST:/api/auth/login/" $binary_remote_addr;
    "POST:/admin/login/" $binary_remote_addr;
}

map "$request_method:$uri" $submission_rate_key {
    default "";
    "POST:/api/submissions/" $binary_remote_addr;
}

limit_req_zone $login_rate_key zone=login:10m rate=10r/m;
limit_req_zone $submission_rate_key zone=submission:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    location = /media { return 404; }
    location ^~ /media/ { return 404; }

    location /static/ {
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=login burst=5 nodelay;
        limit_req zone=submission burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many requests. Please try again later."}';
    }

    location /admin/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
