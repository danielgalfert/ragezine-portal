{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} — RAGE Zine</title>
  <link rel="stylesheet" href="{% static 'errors.css' %}">
</head>
<body>
  <main class="error-shell">
    <p class="error-code">{{ status_code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ detail }}</p>
    <a href="{{ destination }}">{{ link_label }}</a>
  </main>
</body>
</html>
