services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RAGEZINE_PUBLIC_HOST: ${RAGEZINE_PUBLIC_HOST:?Set the public portal hostname}
      RAGEZINE_ADMIN_HOST: ${RAGEZINE_ADMIN_HOST:?Set the staff portal hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./frontend/ragezine-portal/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_ENGINE: postgres
      POSTGRES_HOST: db
      RAGEZINE_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn ragezine_portal.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout ${RAGEZINE_GUNICORN_TIMEOUT:-14400}
      "
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request = urllib.request.Request('http://127.0.0.1:8000/api/auth/csrf/', headers={'Host': host}); urllib.request.urlopen(request, timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    build:
      context: ./frontend/ragezine-portal
      args:
        VITE_PUBLIC_SITE_URL: https://${RAGEZINE_PUBLIC_HOST:?Set the public portal hostname}/
    restart: unless-stopped
    environment:
      RAGEZINE_NGINX_LOGIN_RATE: ${RAGEZINE_NGINX_LOGIN_RATE:-15r/m}
      RAGEZINE_NGINX_LOGIN_BURST: ${RAGEZINE_NGINX_LOGIN_BURST:-8}
      RAGEZINE_NGINX_SUBMISSION_RATE: ${RAGEZINE_NGINX_SUBMISSION_RATE:-5r/m}
      RAGEZINE_NGINX_SUBMISSION_BURST: ${RAGEZINE_NGINX_SUBMISSION_BURST:-5}
      RAGEZINE_NGINX_MAX_BODY_SIZE: ${RAGEZINE_NGINX_MAX_BODY_SIZE:-11g}
      RAGEZINE_NGINX_PROXY_READ_TIMEOUT: ${RAGEZINE_NGINX_PROXY_READ_TIMEOUT:-14400s}
      NGINX_ENVSUBST_FILTER: ^RAGEZINE_NGINX_
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAGEZINE_HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/usr/share/nginx/html/static:ro

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  media_data:
  static_data:
