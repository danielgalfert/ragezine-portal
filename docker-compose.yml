services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_DB_ENGINE: postgres
      POSTGRES_HOST: db
      RAGEZINE_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn ragezine_portal.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    build: ./frontend/ragezine-portal
    environment:
      RAGEZINE_NGINX_LOGIN_RATE: ${RAGEZINE_NGINX_LOGIN_RATE:-15r/m}
      RAGEZINE_NGINX_LOGIN_BURST: ${RAGEZINE_NGINX_LOGIN_BURST:-8}
      RAGEZINE_NGINX_SUBMISSION_RATE: ${RAGEZINE_NGINX_SUBMISSION_RATE:-5r/m}
      RAGEZINE_NGINX_SUBMISSION_BURST: ${RAGEZINE_NGINX_SUBMISSION_BURST:-5}
      RAGEZINE_NGINX_MAX_BODY_SIZE: ${RAGEZINE_NGINX_MAX_BODY_SIZE:-55m}
      NGINX_ENVSUBST_FILTER: ^RAGEZINE_NGINX_
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${RAGEZINE_HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/usr/share/nginx/html/static:ro

volumes:
  postgres_data:
  media_data:
  static_data:
