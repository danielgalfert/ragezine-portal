services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_DB_ENGINE: postgres
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn ragezine_portal.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    build: ./frontend/ragezine-portal
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${RAGEZINE_HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/usr/share/nginx/html/static:ro

volumes:
  postgres_data:
  media_data:
  static_data:
